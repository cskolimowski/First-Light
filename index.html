<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Light</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{margin:0;min-height:100%;background:#050916}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;color:#eef7ff;font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 50% 10%,#11264d 0,#08152e 35%,#040813 76%)}
.shell{width:min(1180px,98vw)}
.mast{display:flex;justify-content:space-between;align-items:flex-end;margin:0 8px 10px;gap:16px}
.brand h1{margin:0;font-size:clamp(24px,4vw,46px);letter-spacing:.18em;color:#f5fbff;text-shadow:0 0 22px #76c8ff55}
.brand p{margin:.22rem 0 0;color:#a9c8e8;font-style:italic}
.status{font:12px/1.3 system-ui,sans-serif;color:#8fa8c8;letter-spacing:.08em;text-transform:uppercase}
.frame{position:relative;border:1px solid #71b8ff44;border-radius:18px;padding:8px;background:linear-gradient(180deg,#102142aa,#070d1ddd);box-shadow:0 28px 90px #000c,0 0 50px #4ea8ff18}
canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:12px;background:#08152b}
.hint{text-align:center;margin-top:9px;color:#7f9cbe;font:13px system-ui,sans-serif}
</style>
</head>
<body>
<main class="shell">
  <div class="mast">
    <div class="brand"><h1>FIRST LIGHT</h1><p>A new flicker. A new journey.</p></div>
    <div class="status">Be the light.</div>
  </div>
  <div class="frame"><canvas id="game" width="960" height="540"></canvas></div>
  <div class="hint">Move: ← → / A D &nbsp; Jump: Space / W / ↑ &nbsp; Restart: R &nbsp; Mute: M</div>
</main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,LEVEL=4300,keys={};
let cam=0,score=0,state='play',tick=0,startTime=performance.now(),landingPulse=0;
const player={x:90,y:350,w:34,h:46,vx:0,vy:0,on:false,wasOn:false,spawnX:90,spawnY:350,face:1};
const plats=[[0,440,720,100],[790,440,620,100],[1490,440,520,100],[2100,440,700,100],[2890,440,480,100],[3440,440,860,100],[330,350,150,24],[560,290,120,24],[930,340,150,24],[1190,270,120,24],[1570,330,160,24],[1810,260,120,24],[2210,340,150,24],[2470,280,130,24],[3010,330,140,24],[3220,250,130,24],[3610,330,160,24],[3880,270,130,24]].map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));
const stars=[[390,310],[610,250],[990,300],[1240,230],[1640,290],[1860,220],[2280,300],[2520,240],[3070,290],[3270,210],[3680,290],[3930,230]].map(([a,b])=>({x:a,y:b,taken:false}));
const enemies=[850,1320,1690,2350,2710,3160,3710].map((a,i)=>({x:a,y:408,w:32,h:32,vx:i%2?1.1:-1.1,dead:false,phase:i*.7}));
const goal={x:4170,y:300,w:42,h:140};
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR')reset(true)});
addEventListener('keyup',e=>keys[e.code]=false);
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function reset(full=false){player.x=player.spawnX;player.y=player.spawnY;player.vx=player.vy=0;player.on=false;cam=0;state='play';if(full){score=0;startTime=performance.now();stars.forEach(s=>s.taken=false);enemies.forEach((e,i)=>{e.dead=false;e.x=[850,1320,1690,2350,2710,3160,3710][i]})}}
function update(){if(state!=='play')return;player.wasOn=player.on;const L=keys.ArrowLeft||keys.KeyA,R=keys.ArrowRight||keys.KeyD,J=keys.Space||keys.ArrowUp||keys.KeyW;if(L){player.vx-=.65;player.face=-1}if(R){player.vx+=.65;player.face=1}player.vx*=.84;player.vx=Math.max(-6,Math.min(6,player.vx));if(J&&player.on){player.vy=-12.8;player.on=false}player.vy=Math.min(15,player.vy+.62);player.x+=player.vx;player.x=Math.max(0,Math.min(LEVEL-player.w,player.x));for(const p of plats)if(hit(player,p)){if(player.vx>0)player.x=p.x-player.w;else if(player.vx<0)player.x=p.x+p.w;player.vx=0}const oldBottom=player.y+player.h;player.y+=player.vy;player.on=false;for(const p of plats)if(hit(player,p)){if(player.vy>=0&&oldBottom<=p.y+8){player.y=p.y-player.h;player.vy=0;player.on=true}else if(player.vy<0){player.y=p.y+p.h;player.vy=0}}if(player.on&&!player.wasOn)landingPulse=1;landingPulse*=.82;if(player.y>H+160)reset();stars.forEach(s=>{if(!s.taken&&Math.hypot(player.x+17-s.x,player.y+20-s.y)<35){s.taken=true;score+=100}});enemies.forEach(e=>{if(e.dead)return;e.x+=e.vx;for(const p of plats){const f={x:e.x,y:e.y+34,w:32,h:3};if(hit(f,p)){e.y=p.y-32;break}}if(hit(player,e)){if(player.vy>2&&player.y+player.h<e.y+18){e.dead=true;player.vy=-8;score+=250}else reset()}});if(hit(player,goal))state='win';cam+=(Math.max(0,Math.min(LEVEL-W,player.x-300))-cam)*.09}
function glow(cx,cy,r,color){const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}
function starPath(cx,cy,outer=13,inner=6,rot=-Math.PI/2){x.beginPath();for(let i=0;i<10;i++){const r=i%2?inner:outer,a=rot+i*Math.PI/5,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}
function mountainLayer(base,amp,step,par,color){x.fillStyle=color;x.beginPath();x.moveTo(-50,H);for(let q=-100;q<W+160;q+=step){const wx=q+cam*par;x.lineTo(q,base-Math.sin(wx*.0038)*amp-Math.sin(wx*.009+1.7)*amp*.38)}x.lineTo(W+100,H);x.closePath();x.fill()}
function drawSky(){const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#07112a');sky.addColorStop(.46,'#0b2a52');sky.addColorStop(.78,'#17476f');sky.addColorStop(1,'#0b213b');x.fillStyle=sky;x.fillRect(0,0,W,H);for(let i=0;i<90;i++){const sx=(i*137-cam*.02)%1050,sy=18+(i*71%250),tw=.45+.55*Math.sin(tick*2+i*.9);x.fillStyle=`rgba(145,205,255,${.18+tw*.45})`;x.beginPath();x.arc(sx,sy,tw>.7?1.5:.8,0,7);x.fill()}const moonX=150-cam*.018,moonY=122;glow(moonX,moonY,145,'#87c8ff33');x.fillStyle='#cde8ff';x.globalAlpha=.18;x.beginPath();x.arc(moonX,moonY,73,0,7);x.fill();x.globalAlpha=1;const haze=x.createLinearGradient(0,250,0,450);haze.addColorStop(0,'#9dd8ff00');haze.addColorStop(.5,'#89cfff14');haze.addColorStop(1,'#6ab5ef08');x.fillStyle=haze;x.fillRect(0,220,W,260);mountainLayer(332,76,68,.05,'#101f3d');mountainLayer(375,70,55,.11,'#112b49');mountainLayer(414,48,46,.19,'#0b3048');x.fillStyle='#081d31aa';for(let i=0;i<10;i++){const sx=i*470-(cam*.16%470)-100,h=80+(i*37%100);x.fillRect(sx,390-h,46,h);x.fillRect(sx+9,377-h,28,13)}x.fillStyle='#061a29cc';for(let i=0;i<58;i++){const sx=i*92-(cam*.31%92)-20,h=45+(i*17%68);x.beginPath();x.moveTo(sx,438);x.lineTo(sx+18,438-h);x.lineTo(sx+36,438);x.fill()}}
function drawPlatform(p){const sx=p.x-cam;if(sx>W+30||sx+p.w<-30)return;const grad=x.createLinearGradient(0,p.y,0,p.y+p.h);grad.addColorStop(0,'#142338');grad.addColorStop(.45,'#0c1728');grad.addColorStop(1,'#07101d');x.fillStyle=grad;rr(sx,p.y,p.w,p.h,4);x.strokeStyle='#263a53';x.lineWidth=1;const rows=Math.max(1,Math.ceil(p.h/30));for(let r=0;r<rows;r++){const yy=p.y+r*30,offset=(r%2)*22;x.beginPath();x.moveTo(sx,yy);x.lineTo(sx+p.w,yy);x.stroke();for(let q=offset;q<p.w;q+=46){x.beginPath();x.moveTo(sx+q,yy);x.lineTo(sx+q,Math.min(p.y+p.h,yy+30));x.stroke()}}x.fillStyle='#162f44';x.fillRect(sx,p.y,p.w,8);x.fillStyle='#55745b';x.fillRect(sx,p.y,p.w,4);x.fillStyle='#86a66d';for(let q=7;q<p.w;q+=37){const mh=2+(q*13%5);x.fillRect(sx+q,p.y-1,18,mh)}for(let q=24;q<p.w;q+=115){const px=sx+q,py=p.y-2;glow(px,py-6,14,'#63c8ff22');x.strokeStyle='#54a5c8';x.lineWidth=1;x.beginPath();x.moveTo(px,py);x.lineTo(px,py-12);x.stroke();x.fillStyle='#76d4ff';x.beginPath();x.ellipse(px-4,py-9,4,2,-.5,0,7);x.ellipse(px+4,py-13,4,2,.5,0,7);x.fill()}}
function drawCollectible(s,i){if(s.taken)return;const sx=s.x-cam,sy=s.y+Math.sin(tick*2+i)*4;glow(sx,sy,36,'#ffd56e55');x.save();x.translate(sx,sy);x.rotate(Math.sin(tick+i)*.08);const g=x.createLinearGradient(-14,-14,14,14);g.addColorStop(0,'#fff7bd');g.addColorStop(.5,'#ffd257');g.addColorStop(1,'#e89a32');x.fillStyle=g;starPath(0,0,15,7);x.fill();x.strokeStyle='#fff1a4';x.lineWidth=1.2;x.stroke();x.restore()}
function drawEnemy(e){if(e.dead)return;const sx=e.x-cam,sy=e.y+Math.sin(tick*3+e.phase)*1.5;glow(sx+16,sy+19,22,'#4c63ff20');x.fillStyle='#10172b';x.beginPath();x.ellipse(sx+16,sy+20,16,12,0,0,7);x.fill();x.fillStyle='#273b79';for(let i=0;i<7;i++){const a=Math.PI+(i/6)*Math.PI,px=sx+16+Math.cos(a)*15,py=sy+18+Math.sin(a)*13;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*8,py+Math.sin(a)*8);x.lineTo(px+Math.cos(a+.35)*5,py+Math.sin(a+.35)*5);x.fill()}x.fillStyle='#f4d56b';x.beginPath();x.ellipse(sx+22,sy+18,4.5,6,0,0,7);x.fill();x.fillStyle='#302f4d';x.beginPath();x.ellipse(sx+11,sy+19,3,4,0,0,7);x.fill()}
function drawPortal(){const cx=goal.x-cam+goal.w/2,top=goal.y+10;glow(cx,top+55,130,'#46b8ff44');x.lineWidth=13;x.strokeStyle='#132b55';x.beginPath();x.moveTo(cx-27,goal.y+135);x.lineTo(cx-27,top+44);x.arc(cx,top+44,27,Math.PI,0);x.lineTo(cx+27,goal.y+135);x.stroke();x.lineWidth=3;x.strokeStyle='#4f7dc4';x.stroke();const pg=x.createLinearGradient(cx,top,cx,goal.y+135);pg.addColorStop(0,'#82ecff');pg.addColorStop(.45,'#3db5ff');pg.addColorStop(1,'#1636a7');x.fillStyle=pg;x.beginPath();x.moveTo(cx-18,goal.y+134);x.lineTo(cx-18,top+47);x.arc(cx,top+47,18,Math.PI,0);x.lineTo(cx+18,goal.y+134);x.closePath();x.fill();x.strokeStyle='#c7f4ff88';x.lineWidth=2;x.beginPath();x.moveTo(cx,top+22);x.lineTo(cx+8,top+34);x.lineTo(cx,top+46);x.lineTo(cx-8,top+34);x.closePath();x.stroke()}
function heroState(){if(!player.on)return player.vy<0?'jump':'fall';if(Math.abs(player.vx)>1.2)return'run';return'idle'}
function drawHero(){const stateName=heroState(),baseX=player.x-cam+17,baseY=player.y+23,bob=stateName==='idle'?Math.sin(tick*3.2)*1.6:stateName==='run'?Math.sin(tick*12)*2:0;let sy=1,sx=1;if(stateName==='jump'){sy=1.1;sx=.94}if(stateName==='fall'){sy=.96;sx=1.04}if(landingPulse>.03){sy=1-.16*landingPulse;sx=1+.18*landingPulse}x.save();x.translate(baseX,baseY+bob);x.scale(player.face*sx,sy);glow(0,-7,46,'#76d9ff33');for(let i=0;i<5;i++){const a=tick*1.7+i*1.3,r=22+(i%2)*8;x.fillStyle='#8be7ff';x.globalAlpha=.35+.3*Math.sin(tick*3+i);x.beginPath();x.arc(Math.cos(a)*r,Math.sin(a*1.2)*16-8,1.4,0,7);x.fill()}x.globalAlpha=1;x.fillStyle='#102f73';x.beginPath();x.moveTo(-7,7);x.quadraticCurveTo(-28-player.vx*1.7,3,-40-player.vx*2.8,12);x.quadraticCurveTo(-27-player.vx*1.2,15,-5,14);x.closePath();x.fill();x.strokeStyle='#4a75c6';x.lineWidth=1;x.stroke();const flame=x.createLinearGradient(0,-38,0,18);flame.addColorStop(0,'#2c77ff');flame.addColorStop(.42,'#6ad8ff');flame.addColorStop(1,'#e9fbff');x.fillStyle=flame;x.beginPath();x.moveTo(0,-38);x.bezierCurveTo(7,-29,15,-31,12,-20);x.bezierCurveTo(19,-20,23,-12,18,-4);x.bezierCurveTo(22,5,17,17,8,21);x.bezierCurveTo(2,25,-2,25,-8,21);x.bezierCurveTo(-18,16,-22,5,-17,-4);x.bezierCurveTo(-22,-13,-15,-21,-9,-21);x.bezierCurveTo(-11,-28,-4,-29,0,-38);x.closePath();x.fill();const core=x.createRadialGradient(0,-8,3,0,-2,28);core.addColorStop(0,'#ffffff');core.addColorStop(.72,'#effcff');core.addColorStop(1,'#c9f0ff');x.fillStyle=core;x.beginPath();x.ellipse(0,4,17,19,0,0,7);x.fill();x.beginPath();x.ellipse(-8,21,7,4,-.1,0,7);x.ellipse(8,21,7,4,.1,0,7);x.fill();x.fillStyle='#0e2e6d';x.beginPath();x.ellipse(0,10,19,7,0,0,7);x.fill();x.strokeStyle='#4a75c6';x.lineWidth=1;x.stroke();x.fillStyle='#d7efff';starPath(-12,9,4.5,2.1);x.fill();x.fillStyle='#7fa8ff';for(const p of [[-2,7],[5,10],[11,8]]){x.beginPath();x.arc(p[0],p[1],.8,0,7);x.fill()}x.fillStyle='#082b70';x.beginPath();x.ellipse(-6,-2,4.2,6.8,0,0,7);x.ellipse(7,-2,4.2,6.8,0,0,7);x.fill();x.fillStyle='#ffffff';x.beginPath();x.arc(-7.2,-4.3,1.35,0,7);x.arc(5.8,-4.3,1.35,0,7);x.fill();x.strokeStyle='#153b70';x.lineWidth=1.2;x.beginPath();x.arc(.5,3.5,4,.15*Math.PI,.85*Math.PI);x.stroke();x.restore()}
function drawHUD(){const taken=stars.filter(s=>s.taken).length,elapsed=state==='win'?0:(performance.now()-startTime)/1000,mm=String(Math.floor(elapsed/60)).padStart(2,'0'),ss=String(Math.floor(elapsed%60)).padStart(2,'0');x.fillStyle='#061126aa';rr(14,13,266,58,14);glow(43,42,26,'#6fd8ff33');x.save();x.translate(43,42);x.scale(.55,.55);const g=x.createLinearGradient(0,-28,0,18);g.addColorStop(0,'#2d7cff');g.addColorStop(.5,'#70ddff');g.addColorStop(1,'#f5ffff');x.fillStyle=g;x.beginPath();x.moveTo(0,-30);x.bezierCurveTo(8,-20,16,-13,11,-5);x.bezierCurveTo(20,4,13,20,0,23);x.bezierCurveTo(-13,20,-20,4,-11,-5);x.bezierCurveTo(-15,-14,-7,-21,0,-30);x.fill();x.restore();x.fillStyle='#eef8ff';x.font='bold 20px Georgia';x.fillText('FIRST LIGHT',68,36);x.fillStyle='#8fb3da';x.font='italic 12px Georgia';x.fillText('A new flicker. A new journey.',68,56);x.fillStyle='#061126aa';rr(W/2-72,15,144,46,13);x.fillStyle='#d8edff';x.font='bold 20px Georgia';x.textAlign='center';x.fillText(`${mm}:${ss}`,W/2,45);x.textAlign='left';x.fillStyle='#061126aa';rr(W-190,15,174,46,13);x.fillStyle='#ffd45e';starPath(W-160,38,10,5);x.fill();x.fillStyle='#edf7ff';x.font='bold 18px Georgia';x.fillText(`× ${taken} / ${stars.length}`,W-141,44);x.fillStyle='#06112699';rr(W/2-205,H-52,410,34,11);x.fillStyle='#8fa9c6';x.font='12px system-ui';x.textAlign='center';x.fillText('MOVE  A D / ← →     JUMP  W / SPACE / ↑     M  MUTE',W/2,H-30);x.textAlign='left'}
function draw(){tick+=.016;drawSky();plats.forEach(drawPlatform);for(let i=0;i<28;i++){const px=(i*181-cam*.52)%1040,py=180+(i*59%240)+Math.sin(tick*1.8+i)*7;glow(px,py,9,'#64d9ff22');x.fillStyle='#8beaff';x.globalAlpha=.55;x.beginPath();x.arc(px,py,1.2,0,7);x.fill();x.globalAlpha=1}stars.forEach(drawCollectible);enemies.forEach(drawEnemy);drawPortal();drawHero();const fog=x.createLinearGradient(0,360,0,H);fog.addColorStop(0,'transparent');fog.addColorStop(1,'#7abfff10');x.fillStyle=fog;x.fillRect(0,330,W,H-330);const vg=x.createRadialGradient(W/2,H/2,180,W/2,H/2,650);vg.addColorStop(.58,'transparent');vg.addColorStop(1,'#02071199');x.fillStyle=vg;x.fillRect(0,0,W,H);drawHUD();if(state==='win'){x.fillStyle='#030818dd';x.fillRect(0,0,W,H);glow(W/2,H/2,240,'#66ccff35');x.textAlign='center';x.fillStyle='#f4fbff';x.font='bold 48px Georgia';x.fillText('THE FIRST LIGHT AWAKENS',W/2,220);x.fillStyle='#9fc9ef';x.font='italic 22px Georgia';x.fillText('The dark remembers what hope looks like.',W/2,260);x.fillStyle='#dceeff';x.font='17px system-ui';x.fillText(`Light ${score}  •  Shards ${stars.filter(s=>s.taken).length}/${stars.length}  •  Press R to journey again`,W/2,307);x.textAlign='left'}}
function loop(){update();draw();requestAnimationFrame(loop)}
reset(true);requestAnimationFrame(loop);
</script>
<script src="audio.js"></script>
</body>
</html>
