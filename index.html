<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Light</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#27345c,#090d1d 68%);color:#fff;font-family:Georgia,serif;overflow:hidden}.wrap{width:min(1100px,97vw)}h1{margin:.2rem 0;letter-spacing:.18em;font-size:clamp(25px,4vw,46px);text-shadow:0 2px 20px #ffd76a66}p{margin:.2rem 0 1rem;color:#dce6ff;font-style:italic}canvas{width:100%;aspect-ratio:16/9;background:#89cfff;border:1px solid #ffffff99;border-radius:18px;box-shadow:0 30px 100px #000b,0 0 50px #8dcfff22;image-rendering:auto}.hint{text-align:center;font:14px system-ui,sans-serif;color:#aebbd8;margin-top:10px}</style></head><body><main class="wrap"><h1>FIRST LIGHT</h1><p>Beyond the old hills, the last beacon is waiting.</p><canvas id="game" width="960" height="540"></canvas><div class="hint">Move: ← → or A D &nbsp; Jump: Space / W / ↑ &nbsp; Restart: R &nbsp; Sound: starts on first key &nbsp; M: mute</div></main><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height,LEVEL=4300,keys={};let cam=0,score=0,state='play',tick=0;
const player={x:90,y:350,w:34,h:46,vx:0,vy:0,on:false,spawnX:90,spawnY:350};
const plats=[[0,440,720,100],[790,440,620,100],[1490,440,520,100],[2100,440,700,100],[2890,440,480,100],[3440,440,860,100],[330,350,150,24],[560,290,120,24],[930,340,150,24],[1190,270,120,24],[1570,330,160,24],[1810,260,120,24],[2210,340,150,24],[2470,280,130,24],[3010,330,140,24],[3220,250,130,24],[3610,330,160,24],[3880,270,130,24]].map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));
const stars=[[390,310],[610,250],[990,300],[1240,230],[1640,290],[1860,220],[2280,300],[2520,240],[3070,290],[3270,210],[3680,290],[3930,230]].map(([a,b])=>({x:a,y:b,taken:false}));
const enemies=[850,1320,1690,2350,2710,3160,3710].map((a,i)=>({x:a,y:408,w:32,h:32,vx:i%2?1.1:-1.1,dead:false}));const goal={x:4170,y:300,w:34,h:140};
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR')reset(true)});addEventListener('keyup',e=>keys[e.code]=false);function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function reset(full=false){player.x=90;player.y=350;player.vx=player.vy=0;cam=0;state='play';if(full){score=0;stars.forEach(s=>s.taken=false);enemies.forEach((e,i)=>{e.dead=false;e.x=[850,1320,1690,2350,2710,3160,3710][i]})}}
function update(){if(state!=='play')return;let L=keys.ArrowLeft||keys.KeyA,R=keys.ArrowRight||keys.KeyD,J=keys.Space||keys.ArrowUp||keys.KeyW;if(L)player.vx-=.65;if(R)player.vx+=.65;player.vx*=.84;player.vx=Math.max(-6,Math.min(6,player.vx));if(J&&player.on){player.vy=-12.8;player.on=false}player.vy=Math.min(15,player.vy+.62);player.x+=player.vx;player.x=Math.max(0,Math.min(LEVEL-player.w,player.x));for(const p of plats)if(hit(player,p)){if(player.vx>0)player.x=p.x-player.w;else if(player.vx<0)player.x=p.x+p.w;player.vx=0}let ob=player.y+player.h;player.y+=player.vy;player.on=false;for(const p of plats)if(hit(player,p)){if(player.vy>=0&&ob<=p.y+8){player.y=p.y-player.h;player.vy=0;player.on=true}else if(player.vy<0){player.y=p.y+p.h;player.vy=0}}if(player.y>H+160)reset();stars.forEach(s=>{if(!s.taken&&Math.hypot(player.x+17-s.x,player.y+20-s.y)<35){s.taken=true;score+=100}});enemies.forEach(e=>{if(e.dead)return;e.x+=e.vx;for(const p of plats){let f={x:e.x,y:e.y+34,w:32,h:3};if(hit(f,p)){e.y=p.y-32;break}}if(hit(player,e)){if(player.vy>2&&player.y+player.h<e.y+18){e.dead=true;player.vy=-8;score+=250}else reset()}});if(hit(player,goal))state='win';cam+=(Math.max(0,Math.min(LEVEL-W,player.x-300))-cam)*.09}
function glow(cx,cy,r,col){let g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2)}
function hill(base,amp,step,par,col){x.fillStyle=col;x.beginPath();x.moveTo(-50,H);for(let q=-100;q<W+150;q+=step){let wx=q+cam*par;x.lineTo(q,base-Math.sin(wx*.004)*amp-Math.sin(wx*.009+2)*amp*.35)}x.lineTo(W+100,H);x.closePath();x.fill()}
function draw(){tick+=.016;let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#315a91');sky.addColorStop(.42,'#9fc9d5');sky.addColorStop(.72,'#f3c98c');sky.addColorStop(1,'#d98c62');x.fillStyle=sky;x.fillRect(0,0,W,H);glow(790-cam*.015,95,180,'#ffe6a999');x.fillStyle='#fff0c8';x.beginPath();x.arc(790-cam*.015,95,35,0,7);x.fill();for(let i=0;i<8;i++){let q=((i*290-cam*.07)%1400)-180,yy=70+(i%3)*55;x.fillStyle='#f6f4e744';x.beginPath();x.ellipse(q,yy,90,24,0,0,7);x.ellipse(q+60,yy-8,70,30,0,0,7);x.fill()}hill(335,62,65,.08,'#6f8293');hill(375,78,58,.15,'#526e72');hill(410,48,42,.23,'#315952');x.fillStyle='#23483f88';for(let i=0;i<55;i++){let q=i*115-(cam*.34%115),h=45+(i*19%55);x.beginPath();x.moveTo(q,435);x.lineTo(q+20,435-h);x.lineTo(q+40,435);x.fill()}plats.forEach(p=>{let sx=p.x-cam;if(sx>W||sx+p.w<0)return;let dirt=x.createLinearGradient(0,p.y,0,p.y+p.h);dirt.addColorStop(0,'#5d4935');dirt.addColorStop(1,'#2d2b2b');x.fillStyle=dirt;x.fillRect(sx,p.y,p.w,p.h);x.fillStyle='#8c7651';for(let q=12;q<p.w;q+=31)x.fillRect(sx+q,p.y+18+(q*7%Math.max(20,p.h-28)),7,3);x.fillStyle='#446c45';x.fillRect(sx,p.y,p.w,9);x.fillStyle='#78a85d';x.fillRect(sx,p.y,p.w,4);for(let q=8;q<p.w;q+=42){x.fillStyle=q%84?'#d8cf78':'#eaa3aa';x.beginPath();x.arc(sx+q,p.y-3,2.5,0,7);x.fill()}});for(let i=0;i<34;i++){let q=(i*173+tick*12)%W,yy=120+(i*67%300)+Math.sin(tick*1.7+i)*8;glow(q,yy,8,'#fff3a955');x.fillStyle='#fff2a8';x.fillRect(q,yy,1.5,1.5)}stars.forEach((s,i)=>{if(s.taken)return;let sx=s.x-cam,sy=s.y+Math.sin(tick*2+i)*5;glow(sx,sy,34,'#ffd86d99');x.save();x.translate(sx,sy);x.rotate(tick*.8+i);let gr=x.createLinearGradient(-12,-12,12,12);gr.addColorStop(0,'#fffde2');gr.addColorStop(.5,'#ffd85e');gr.addColorStop(1,'#ff9f43');x.fillStyle=gr;x.beginPath();x.moveTo(0,-17);x.lineTo(8,-5);x.lineTo(14,0);x.lineTo(7,7);x.lineTo(0,18);x.lineTo(-7,7);x.lineTo(-14,0);x.lineTo(-8,-5);x.closePath();x.fill();x.restore()});enemies.forEach(e=>{if(e.dead)return;let sx=e.x-cam,sy=e.y;x.fillStyle='#433342';x.beginPath();x.ellipse(sx+16,sy+19,17,14,0,0,7);x.fill();x.fillStyle='#5d465a';x.beginPath();x.moveTo(sx+3,sy+12);x.lineTo(sx+7,sy-3);x.lineTo(sx+13,sy+9);x.moveTo(sx+19,sy+9);x.lineTo(sx+26,sy-3);x.lineTo(sx+29,sy+13);x.fill();x.fillStyle='#f7d67b';x.beginPath();x.arc(sx+11,sy+17,2.5,0,7);x.arc(sx+22,sy+17,2.5,0,7);x.fill()});let bx=goal.x-cam+17;glow(bx,goal.y+45,120,'#ffe68daa');x.fillStyle='#5a4d48';x.fillRect(bx-7,goal.y+30,14,110);x.strokeStyle='#f8e8a2';x.lineWidth=3;x.beginPath();x.arc(bx,goal.y+25,18,0,7);x.stroke();x.fillStyle='#fff6b0';x.beginPath();x.arc(bx,goal.y+25,8+Math.sin(tick*3)*2,0,7);x.fill();let px=player.x-cam,py=player.y;x.fillStyle='#172c42';x.fillRect(px+7,py+25,20,20);x.fillStyle='#c95648';x.fillRect(px+3,py+24,28,8);x.fillStyle='#d56d50';x.fillRect(px-5,py+27,13+Math.max(0,-player.vx*2),5);x.fillStyle='#e8bd8c';x.beginPath();x.arc(px+17,py+15,11,0,7);x.fill();x.fillStyle='#4a332b';x.beginPath();x.arc(px+17,py+12,12,Math.PI,Math.PI*2);x.fill();x.fillStyle='#1b2430';x.fillRect(px+12,py+14,2,2);x.fillRect(px+21,py+14,2,2);x.fillStyle='#6f4a35';x.fillRect(px+5,py+42,10,4);x.fillRect(px+21,py+42,10,4);let vg=x.createRadialGradient(W/2,H/2,180,W/2,H/2,650);vg.addColorStop(.55,'transparent');vg.addColorStop(1,'#07101d88');x.fillStyle=vg;x.fillRect(0,0,W,H);x.fillStyle='#fff7dc';x.shadowColor='#000';x.shadowBlur=5;x.font='bold 18px Georgia';x.fillText('LIGHT  '+score,24,32);x.fillText('SHARDS  '+stars.filter(s=>s.taken).length+' / '+stars.length,24,57);x.shadowBlur=0;if(state==='win'){x.fillStyle='#07101dcc';x.fillRect(0,0,W,H);glow(W/2,H/2,210,'#ffe49d44');x.textAlign='center';x.fillStyle='#fff5d6';x.font='bold 48px Georgia';x.fillText('THE FIRST LIGHT BURNS AGAIN',W/2,225);x.font='italic 22px Georgia';x.fillText('The valley remembers your name.',W/2,266);x.font='18px system-ui';x.fillText('Score '+score+'  •  Press R to return',W/2,310);x.textAlign='left'}}let last=0;function loop(t){last=t;update();draw();requestAnimationFrame(loop)}reset(true);requestAnimationFrame(loop);
</script><script src="audio.js"></script></body></html>
